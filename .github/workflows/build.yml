name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  stress:
    name: Required deterministic stress
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout sshz
        uses: actions/checkout@v5
        with:
          path: sshz
      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail

          version="0.16.0"
          archive="zig-x86_64-linux-${version}.tar.xz"
          archive_sha256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          archive_path="${RUNNER_TEMP}/${archive}"
          zig_dir="${RUNNER_TEMP}/zig-x86_64-linux-${version}"
          curl -fsSL "https://github.com/ctaggart/zig/releases/download/v${version}/${archive}" -o "${archive_path}"
          actual_sha256="$(shasum -a 256 "${archive_path}" | awk '{print $1}')"
          if [ "${actual_sha256}" != "${archive_sha256}" ]; then
            echo "SHA-256 mismatch for ${archive}" >&2
            exit 1
          fi
          tar -xf "${archive_path}" -C "${RUNNER_TEMP}"
          echo "${zig_dir}" >> "${GITHUB_PATH}"
          "${zig_dir}/zig" version
      - name: Install resource measurement tool
        run: |
          sudo apt-get update
          sudo apt-get install -y time
      - name: Run deterministic stress acceptance
        working-directory: sshz
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sshz-stress-safe"
          /usr/bin/time \
            -f "resource elapsed_seconds=%e max_rss_kib=%M exit=%x" \
            -o "${RUNNER_TEMP}/sshz-stress-safe/resource.txt" \
            zig build stress -Doptimize=ReleaseSafe -- --seed 1751547392 \
            2>&1 | tee "${RUNNER_TEMP}/sshz-stress-safe/stress.log"
          cat "${RUNNER_TEMP}/sshz-stress-safe/resource.txt"
          elapsed="$(sed -n 's/.*elapsed_seconds=\([^ ]*\).*/\1/p' "${RUNNER_TEMP}/sshz-stress-safe/resource.txt")"
          rss="$(sed -n 's/.*max_rss_kib=\([^ ]*\).*/\1/p' "${RUNNER_TEMP}/sshz-stress-safe/resource.txt")"
          awk -v value="$elapsed" 'BEGIN { exit !(value <= 600) }' || {
            echo "stress elapsed-time budget exceeded: ${elapsed}s > 600s" >&2
            exit 1
          }
          if (( rss > 1048576 )); then
            echo "stress RSS budget exceeded: ${rss} KiB > 1048576 KiB" >&2
            exit 1
          fi
      - name: Upload safe stress failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-failure-logs
          path: ${{ runner.temp }}/sshz-stress-safe/
          if-no-files-found: ignore
          retention-days: 7

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{matrix.os}}
    steps:
      - name: Checkout sshz
        uses: actions/checkout@v5
        with:
          path: sshz
      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail

          version="0.16.0"
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)
              zig_target="x86_64-linux"
              archive_sha256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
              ;;
            macOS-ARM64)
              zig_target="aarch64-macos"
              archive_sha256="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
              ;;
            macOS-X64)
              zig_target="x86_64-macos"
              archive_sha256="0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7"
              ;;
            Windows-X64)
              zig_target="x86_64-windows"
              archive_sha256="68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e"
              ;;
            *)
              echo "Unsupported runner: ${{ runner.os }}-${{ runner.arch }}" >&2
              exit 1
              ;;
          esac

          # Windows releases ship as .zip, every other target as .tar.xz.
          case "${{ runner.os }}" in
            Windows) archive_ext="zip" ;;
            *) archive_ext="tar.xz" ;;
          esac

          archive="zig-${zig_target}-${version}.${archive_ext}"
          archive_path="${RUNNER_TEMP}/${archive}"
          zig_dir="${RUNNER_TEMP}/zig-${zig_target}-${version}"
          curl -fsSL "https://github.com/ctaggart/zig/releases/download/v${version}/${archive}" -o "${archive_path}"
          actual_sha256="$(shasum -a 256 "${archive_path}" | awk '{print $1}')"
          if [ "${actual_sha256}" != "${archive_sha256}" ]; then
            echo "SHA-256 mismatch for ${archive}" >&2
            exit 1
          fi
          if [ "${archive_ext}" = "zip" ]; then
            unzip -q "${archive_path}" -d "${RUNNER_TEMP}"
          else
            tar -xf "${archive_path}" -C "${RUNNER_TEMP}"
          fi
          echo "${zig_dir}" >> "${GITHUB_PATH}"
          "${zig_dir}/zig" version
      - name: Build test
        run: zig build test
        working-directory: sshz
      - name: Bounded malformed-input corpus (Debug and ReleaseSafe)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          zig build malformed -Doptimize=Debug --test-timeout 30s --seed 0
          zig build malformed -Doptimize=ReleaseSafe --test-timeout 30s --seed 0
        working-directory: sshz
      - name: Build lib
        run: zig build
        working-directory: sshz
      - name: Build sshz
        if: runner.os != 'Windows'
        run: zig build
        working-directory: sshz/sshz
      - name: Build sshzd
        if: runner.os != 'Windows'
        run: zig build
        working-directory: sshz/sshzd
      - name: Install interop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dropbear-bin gcc libssh-dev openssh-client openssh-server pkg-config
          sudo mkdir -p /run/sshd
      - name: Interop test
        if: runner.os == 'Linux'
        run: zig build interop
        working-directory: sshz
        env:
          SSHZ_INTEROP_ARTIFACTS: ${{ runner.temp }}/sshz-interop
          SSHZ_INTEROP_REQUIRE_DROPBEAR: "1"
          SSHZ_INTEROP_REQUIRE_LIBSSH: "1"
      - name: Upload interop failure logs
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: interop-failure-logs
          path: ${{ runner.temp }}/sshz-interop/logs/
          if-no-files-found: ignore
          retention-days: 7
